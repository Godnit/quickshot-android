name: Build Android APKs
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
permissions:
  contents: read
jobs:
  build-quickshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build QuickShot debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'
          arguments: assembleDebug --no-daemon
      - name: Upload QuickShot APK
        uses: actions/upload-artifact@v4
        with:
          name: quickshot-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  build-stickman:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build Stick Man debug APK
        working-directory: stickman-buddy
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload Stick Man APK
        uses: actions/upload-artifact@v4
        with:
          name: stickman-buddy-debug-apk
          path: stickman-buddy/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
