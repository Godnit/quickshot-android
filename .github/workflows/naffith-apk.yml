name: Build Naffith APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'naffith/**'
      - '.github/workflows/naffith-apk.yml'
    branches: [ "main" ]
permissions:
  contents: read
jobs:
  build-naffith:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'
          build-root-directory: naffith
          arguments: assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: naffith-debug-apk
          path: naffith/app/build/outputs/apk/debug/app-debug.apk
