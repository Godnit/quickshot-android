name: Build Soccer 3D APK
on:
  push:
    branches: [ main ]
    paths:
      - 'soccer3d/**'
      - '.github/workflows/soccer3d.yml'
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.2.2 and Android export templates
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/godot"
          curl -L --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d "$HOME/godot"
          curl -L --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.2.2.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -r /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/4.2.2.stable/"
      - name: Create debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
      - name: Export APK
        shell: bash
        run: |
          set -e
          mkdir -p build
          GODOT_BIN="$HOME/godot/Godot_v4.2.2-stable_linux.x86_64"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --headless --path soccer3d --editor --quit
          "$GODOT_BIN" --headless --path soccer3d --export-debug "Android" "$GITHUB_WORKSPACE/build/Soccer3D.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Soccer3D-Android
          path: build/Soccer3D.apk
