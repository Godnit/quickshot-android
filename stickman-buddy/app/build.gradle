apply plugin: 'com.android.application'

android {
    namespace 'com.example.stickman'
    compileSdk 35
    defaultConfig {
        applicationId 'com.example.stickman'
        minSdkVersion 21
        targetSdkVersion 27
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
