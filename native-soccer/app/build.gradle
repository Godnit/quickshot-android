plugins {
    id "com.android.application"
}

android {
    namespace "com.godnit.nativesoccer"
    compileSdk 35

    defaultConfig {
        applicationId "com.godnit.nativesoccer"
        minSdk 27
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}
